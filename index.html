<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, user-scalable=no" />
	<title>Witchy</title>
	<style>
		body { touch-action: none; margin: 0; border: 0; padding: 0; text-align: center; background-color: black; }
		#canvas { display: block; margin: 0; color: white; }
		#canvas:focus { outline: none; }
		.godot {
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			color: #e0e0e0; background-color: #3b3943;
			background-image: linear-gradient(to bottom, #403e48, #35333c);
			border: 1px solid #45434e; box-shadow: 0 0 1px 1px #2f2d35;
		}
		#status { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; visibility: hidden; }
		#status-progress {
			width: 366px; height: 7px; background-color: #38363A; border: 1px solid #444246;
			padding: 1px; box-shadow: 0 0 2px 1px #1B1C22; border-radius: 2px; visibility: visible;
		}
		@media only screen and (orientation: portrait) { #status-progress { width: 61.8%; } }
		#status-progress-inner {
			height: 100%; width: 0; box-sizing: border-box; transition: width 0.5s linear;
			background-color: #9b6bd6; border-radius: 3px;
		}
		#status-notice { margin: 0 100px; line-height: 1.3; padding: 4px 6px; visibility: visible; }
	</style>
	<link rel="icon" type="image/png" href="Witchy.icon.png" />
</head>
<body>
	<canvas id="canvas">
		HTML5 canvas appears to be unsupported in the current browser.<br />
		Please try updating or use a different browser.
	</canvas>
	<div id="status">
		<div id="status-progress" style="display: none;"><div id="status-progress-inner"></div></div>
		<div id="status-notice" class="godot" style="display: none;"></div>
	</div>

	<script src="Witchy.js"></script>
	<script>
		// ===== EDIT THESE TO MATCH YOUR FILES =====
		const EXECUTABLE = 'Witchy';          // base name of Witchy.js / Witchy.wasm
		const PACK = 'Witchy.pck';            // name the game expects
		const PARTS = [                       // every part, in order
			'Witchy.pck.part0',
			'Witchy.pck.part1',
			'Witchy.pck.part2',
			'Witchy.pck.part3',
			'Witchy.pck.part4',
			'Witchy.pck.part5',
		];
		// ==========================================

		const engine = new Engine({ args: [], canvasResizePolicy: 2, executable: EXECUTABLE, focusCanvas: true });

		const progressBox = document.getElementById('status-progress');
		const progressInner = document.getElementById('status-progress-inner');
		const notice = document.getElementById('status-notice');

		function showProgress(fraction) {
			progressBox.style.display = 'block';
			progressInner.style.width = (fraction * 100) + '%';
		}

		function showError(err) {
			const msg = err && err.message ? err.message : String(err);
			console.error(msg);
			progressBox.style.display = 'none';
			notice.textContent = msg;
			notice.style.display = 'block';
		}

		// Downloads every part, tracks progress, and joins them into one file in memory.
		async function loadPack() {
			const responses = await Promise.all(PARTS.map(async (p) => {
				const r = await fetch(p);
				if (!r.ok) throw new Error('Missing file: ' + p + ' (' + r.status + ')');
				return r;
			}));
			const total = responses.reduce((n, r) => n + Number(r.headers.get('Content-Length') || 0), 0);
			let loaded = 0;

			const chunks = await Promise.all(responses.map(async (r) => {
				const reader = r.body.getReader();
				const pieces = [];
				let size = 0;
				for (;;) {
					const { done, value } = await reader.read();
					if (done) break;
					pieces.push(value);
					size += value.length;
					loaded += value.length;
					if (total > 0) showProgress(Math.min(loaded / total, 1));
				}
				const out = new Uint8Array(size);
				let off = 0;
				for (const p of pieces) { out.set(p, off); off += p.length; }
				return out;
			}));

			const full = new Uint8Array(chunks.reduce((n, c) => n + c.length, 0));
			let off = 0;
			for (const c of chunks) { full.set(c, off); off += c.length; }
			return full;
		}

		if (!Engine.isWebGLAvailable()) {
			showError('WebGL not available');
		} else {
			showProgress(0);
			Promise.all([
				engine.init(EXECUTABLE),
				loadPack().then((buf) => engine.preloadFile(buf, PACK)),
			])
				.then(() => engine.start({ args: ['--main-pack', PACK] }))
				.then(() => { progressBox.style.display = 'none'; })
				.catch(showError);
		}
	</script>
</body>
</html>
